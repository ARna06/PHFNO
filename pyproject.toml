[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-port-hamiltonian"
version = "0.1.0"
description = "Fourier port-Hamiltonian neural operators in PyTorch"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "neuraloperator==2.0.0", "tqdm>=4.66"]

[project.optional-dependencies]
notebook = ["ipykernel", "nbformat>=5", "nbclient>=0.10", "matplotlib>=3.7"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
